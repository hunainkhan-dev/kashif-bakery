# Render blueprint — deploy the API as a free web service.
# In the Render dashboard, add the secret env vars (MONGO_URI, JWT_SECRET, ADMIN_*).
services:
  - type: web
    name: kashif-bakery-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
